[profile.default]
src = "src"
test = "test"
out = "target/foundry/out"
cache_path = "target/foundry/cache"
test_failures_file = "target/foundry/test-cache/test-failures"
libs = []
remappings = ["@prb/math/=node_modules/@prb/math/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
failure_persist_dir = "target/foundry/test-cache/fuzz"
runs = 256
seed = "0x666c7572626f"

[profile.demo]
script = "script"
broadcast = "target/broadcast"
fs_permissions = [{ access = "read-write", path = "./target/deployments" }]

[profile.settlement_replay]
test = "replay"
ffi = false
fs_permissions = [{ access = "read", path = "./target/settlement-replay" }]
